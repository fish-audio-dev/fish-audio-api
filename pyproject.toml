[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-audio-api"
version = "0.1.0"
description = "Python client for the Fish Audio voice changer API: speech-to-speech voice cloning via a hosted endpoint."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "fish-audio-dev"}]
keywords = ["ai api", "fish audio", "fish audio api", "fish audio python", "mimo-tts", "synexa", "voice-changer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/fish-audio-dev/fish-audio-api"
Documentation = "https://fish-audio-dev.github.io/fish-audio-api/"
"Hosted model" = "https://synexa.ai/explore/fish-audio/voice-changer?utm_source=github&utm_medium=ugc&utm_campaign=fish-audio-dev&utm_content=pyproject&utm_term=tier-c"

[tool.setuptools.packages.find]
include = ["fish_audio_api*"]
